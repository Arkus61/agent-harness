name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Configure Windows MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expose Rust locations to isolation checks
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for name, directory in [("CARGO_HOME", ".cargo"), ("RUSTUP_HOME", ".rustup")]:
                  value = os.environ.get(name) or str(Path.home() / directory)
                  environment.write(f"{name}={value}\n")
      - uses: Swatinem/rust-cache@v2
      - name: Prepare required Linux isolation backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Runner images make /usr/lib/jvm world-writable. Its alternatives
          # must satisfy the same immutable system-tool checks as local hosts.
          sudo chmod -R go-w /usr/lib/jvm
          # Enable namespace creation on this disposable CI host. The harness
          # still requires real confinement and disables nested user namespaces.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          bwrap --unshare-all --unshare-user --disable-userns --cap-drop ALL \
            --die-with-parent --ro-bind /usr /usr --symlink usr/bin /bin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev -- /usr/bin/true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test contracts and recovery
        env:
          HARNESS_REQUIRE_LINUX_ISOLATION: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --locked --all-targets
      - name: Validate independent Rust AST oracle
        run: |
          cargo fmt --manifest-path evals/live/structure-check/Cargo.toml -- --check
          cargo clippy --locked --manifest-path evals/live/structure-check/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path evals/live/structure-check/Cargo.toml
          cargo fmt --manifest-path evals/benchmark/structure-check/Cargo.toml -- --check
          cargo clippy --locked --manifest-path evals/benchmark/structure-check/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path evals/benchmark/structure-check/Cargo.toml
      - name: Validate oracle CLI and fail-closed controller
        run: |
          python tests/evaluation_oracle.py -v
          python tests/evaluation_manifest.py -v
          python evals/benchmark/test_suite.py
      - name: Validate all benchmark controls in real isolation
        if: runner.os == 'Linux'
        run: python evals/benchmark/suite.py prepare --output artifacts/benchmark-ci
      - name: Build release CLI
        run: cargo build --locked --release --bin harness
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/harness
            target/release/harness.exe
          if-no-files-found: error
